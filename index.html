<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>MotoManage Pro</title>
    <meta name="description" content="Sistema completo de gestao para oficinas de motos: clientes, veiculos, agendamentos, ordens de servico, estoque de pecas e financeiro." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Runs before first paint so the page renders in the right theme with no flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          var d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches)
          document.documentElement.classList.toggle('dark', d)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
